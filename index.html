<?xml version="1.0" encoding="UTF-8" ?>
<html xmlns='http://www.w3.org/1999/xhtml'
      xmlns:b='http://www.google.com/2005/gml/b'
      xmlns:data='http://www.google.com/2005/gml/data'
      xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
<meta charset='UTF-8'/>
<meta content='width=device-width, initial-scale=1, viewport-fit=cover' name='viewport'/>
<title><data:blog.pageTitle/></title>
<b:include data='blog' name='all-head-content'/>
<link href='https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,500&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap' rel='stylesheet'/>
<b:skin><![CDATA[
:root{--wall:#262b33;--wall2:#2d333d;--card:#f6f1e4;--ink:#262b33;--pin:#e0533d;--rule:#4a5160;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:
    radial-gradient(circle at 15% 20%, var(--wall2) 0, transparent 55%),
    radial-gradient(circle at 85% 80%, var(--wall2) 0, transparent 50%),
    var(--wall);
  color:var(--card);font-family:'Fraunces',serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
a{color:inherit;text-decoration:none;}
.wrap{max-width:760px;margin:0 auto;padding:30px 18px 70px;}
header{text-align:left;margin-bottom:26px;padding-bottom:16px;border-bottom:2px solid var(--rule);}
header .name{font-weight:700;font-size:1.6rem;}
header .tag{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#9aa3b5;margin-top:4px;}
.intro{font-style:italic;font-size:1rem;line-height:1.6;max-width:46ch;color:#cfd4df;margin:24px 0 30px;}
.grid{display:grid;grid-template-columns:1fr;gap:26px;}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr;}}
.card{
  display:block;background:var(--card);color:var(--ink);padding:18px 18px 16px;
  box-shadow:0 10px 18px -6px #00000055;position:relative;
}
.card:nth-child(odd){transform:rotate(-2deg);}
.card:nth-child(even){transform:rotate(1.6deg);}
.card:hover{transform:rotate(0deg) scale(1.02);transition:transform .2s ease;}
.card .pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--pin);box-shadow:0 2px 3px #0006;}
.card .tag{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:#8a7f66;margin-bottom:8px;}
.card h2{font-weight:600;font-size:1.12rem;line-height:1.3;margin:0 0 8px;}
.card p{font-size:.85rem;line-height:1.5;color:#423e30;margin:0;}
.empty{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:#7b8396;border:1px dashed #4a5160;padding:22px;}
.back{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:#9aa3b5;margin-bottom:22px;}
.back:hover{color:var(--pin);}
.chead{border-bottom:2px solid var(--rule);padding-bottom:18px;margin-bottom:22px;}
.chead .meta{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--pin);margin-bottom:10px;}
.chead h1{font-weight:700;font-size:1.7rem;line-height:1.2;margin:0;}
.cbody{font-size:1.05rem;line-height:1.75;color:#e4e7ee;}
.cbody p{margin:0 0 1.1em;}
.cbody img{max-width:100%;height:auto;}
.cbody a{color:var(--pin);text-decoration:underline;}
.cbody blockquote{border-left:3px solid var(--pin);margin:0 0 1.1em;padding-left:14px;color:#c2c8d4;font-style:italic;}
footer.sitefoot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-family:'JetBrains Mono',monospace;font-size:.68rem;color:#7b8396;}
]]></b:skin>
</head>
<body>
<div class='wrap'>

<header>
<a expr:href='data:blog.homepageUrl'>
<div class='name'><data:blog.title/></div>
</a>
<div class='tag'>pinned to the board, not filed away</div>
</header>

<b:section id='main' showaddelement='no'>
<b:widget id='Blog1' locked='true' title='Web Panchayat' type='Blog' version='2'>

<b:includable id='main' var='top'>
  <b:if cond='data:view.isMultipleItems'>
    <p class='intro'>Every notice up here started as something someone pinned in public — a clip, a rumour, a decision nobody voted on. We leave it up until the argument&#39;s actually finished.</p>
    <div class='grid'>
      <b:loop values='data:posts' var='post'>
        <b:include data='post' name='pinCard'/>
      </b:loop>
    </div>
  </b:if>
  <b:if cond='data:view.isSingleItem'>
    <b:loop values='data:posts' var='post'>
      <b:include data='post' name='caseFile'/>
    </b:loop>
  </b:if>
</b:includable>

<b:includable id='pinCard' var='post'>
  <a class='card' expr:href='data:post.url'>
    <div class='pin'/>
    <div class='tag'><data:post.dateHeader/></div>
    <h2><data:post.title/></h2>
    <p><data:post.snippet/></p>
  </a>
</b:includable>

<b:includable id='caseFile' var='post'>
  <a class='back' expr:href='data:blog.homepageUrl'>&#8592; back to the board</a>
  <div class='chead'>
    <div class='meta'>pinned &#183; <data:post.dateHeader/></div>
    <h1><data:post.title/></h1>
  </div>
  <div class='cbody'>
    <data:post.body/>
  </div>
</b:includable>

</b:widget>
</b:section>

<footer class='sitefoot'><data:blog.title/> &#183; est. 2026</footer>

</div>
</body>
</html>
